  android-apk:
    needs: [tests, windows-runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir
        run: |
          unzip -oq forge.zip
          if [ -d forge ]; then cp -a forge/. .; fi
      - uses: actions/download-artifact@v4
        with:
          name: forge_runtime
          path: android/app/src/main/assets
      - name: Juego independiente (opcional)
        if: ${{ github.event.inputs.game_dir != '' || github.event.inputs.game_pack != '' }}
        env:
          GAME_DIR: ${{ github.event.inputs.game_dir }}
          GAME_PACK: ${{ github.event.inputs.game_pack }}
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          if [ -n "$GAME_DIR" ]; then
            D="$GAME_DIR"
            cp "$D/game.pack" android/app/src/main/assets/game.pack
            if [ -f "$D/icon.png" ]; then cp "$D/icon.png" android/app/src/main/res/drawable-nodpi/app_icon.png; fi
            if [ -f "$D/apk.properties" ]; then echo "APK_PROPS=$GITHUB_WORKSPACE/$D/apk.properties" >> "$GITHUB_ENV"; fi
          else
            cp "$GAME_PACK" android/app/src/main/assets/game.pack
          fi
          touch android/app/src/main/assets/standalone
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          cache-disabled: true
      - name: Compilar APK
        run: |
          set +e
          for n in 1 2 3; do
            echo "=== Intento $n de 3 ==="
            gradle -p android assembleDebug --console=plain --refresh-dependencies 2>&1 | tee apk_log.txt
            code=${PIPESTATUS[0]}
            if [ "$code" = "0" ]; then break; fi
            rm -rf ~/.gradle/caches/modules-2 || true
            sleep 15
          done
          if [ "$code" != "0" ]; then
            echo "=== ERRORES ==="
            grep -nE "error:|error C|undefined reference|What went wrong|Could not|FAILED" -A3 apk_log.txt | head -60
            { echo "## Errores del APK"; grep -nE "error:|undefined reference|What went wrong|Could not" -A3 apk_log.txt | head -60; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ (github.event.inputs.game_dir != '' || github.event.inputs.game_pack != '') && 'game-apk' || 'forge-apk' }}
          path: android/app/build/outputs/apk/debug/*.apk
